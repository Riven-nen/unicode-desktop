<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="survey-item-title survey-item-desc">
  <title id="survey-item-title">Preliminary survey item means</title>
  <desc id="survey-item-desc">Horizontal bar chart of eight survey item means. Items 1 to 5 measure the current workflow; items 6 to 8 measure preference for an integrated workspace.</desc>

  <rect x="20" y="20" width="1360" height="860" rx="18" fill="#ffffff" stroke="#dadce0" stroke-width="2"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="50" y="62" font-size="28" font-weight="600" fill="#1f2937">Preliminary Survey — Item Means</text>
    <text x="50" y="88" font-size="15" fill="#5f6368">Five-point Likert scale; higher values indicate stronger agreement.</text>
  </g>

  <!-- Axis and threshold -->
  <line x1="500" y1="660" x2="1280" y2="660" stroke="#9aa0a6" stroke-width="1.5"/>
  <line x1="1030" y1="125" x2="1030" y2="660" stroke="#f29900" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1040" y="120" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#b06000">Agree threshold (3.40)</text>

  <!-- Bars -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <!-- 1 -->
    <text x="480" y="164" text-anchor="end" font-size="14" fill="#202124">1. Browser/editor switching</text>
    <rect x="500" y="140" width="468" height="38" rx="4" fill="#8ab4f8"/>
    <text x="978" y="164" font-size="13" font-weight="600" fill="#174ea6" stroke="#ffffff" stroke-width="4" paint-order="stroke">3.00</text>
    <!-- 2 -->
    <text x="480" y="229" text-anchor="end" font-size="14" fill="#202124">2. Download/upload files</text>
    <rect x="500" y="205" width="498" height="38" rx="4" fill="#8ab4f8"/>
    <text x="1008" y="229" font-size="13" font-weight="600" fill="#174ea6" stroke="#ffffff" stroke-width="4" paint-order="stroke">3.19</text>
    <!-- 3 -->
    <text x="480" y="294" text-anchor="end" font-size="14" fill="#202124">3. Compiler/environment setup</text>
    <rect x="500" y="270" width="511" height="38" rx="4" fill="#8ab4f8"/>
    <text x="1021" y="294" font-size="13" font-weight="600" fill="#174ea6" stroke="#ffffff" stroke-width="4" paint-order="stroke">3.28</text>
    <!-- 4 -->
    <text x="480" y="359" text-anchor="end" font-size="14" fill="#202124">4. Tracking submissions</text>
    <rect x="500" y="335" width="477" height="38" rx="4" fill="#8ab4f8"/>
    <text x="987" y="359" font-size="13" font-weight="600" fill="#174ea6" stroke="#ffffff" stroke-width="4" paint-order="stroke">3.06</text>
    <!-- 5 -->
    <text x="480" y="424" text-anchor="end" font-size="14" fill="#202124">5. Current workflow frustrating</text>
    <rect x="500" y="400" width="546" height="38" rx="4" fill="#8ab4f8"/>
    <text x="1056" y="424" font-size="13" font-weight="600" fill="#174ea6" stroke="#ffffff" stroke-width="4" paint-order="stroke">3.50</text>
    <!-- 6 -->
    <text x="480" y="489" text-anchor="end" font-size="14" fill="#202124">6. Single integrated workspace</text>
    <rect x="500" y="465" width="572" height="38" rx="4" fill="#81c995"/>
    <text x="1082" y="489" font-size="13" font-weight="600" fill="#137333" stroke="#ffffff" stroke-width="4" paint-order="stroke">3.67</text>
    <!-- 7 -->
    <text x="480" y="554" text-anchor="end" font-size="14" fill="#202124">7. Built-in editor + terminal</text>
    <rect x="500" y="530" width="576" height="38" rx="4" fill="#81c995"/>
    <text x="1086" y="554" font-size="13" font-weight="600" fill="#137333" stroke="#ffffff" stroke-width="4" paint-order="stroke">3.69</text>
    <!-- 8 -->
    <text x="480" y="619" text-anchor="end" font-size="14" fill="#202124">8. Progress dashboard</text>
    <rect x="500" y="595" width="585" height="38" rx="4" fill="#81c995"/>
    <text x="1095" y="619" font-size="13" font-weight="600" fill="#137333" stroke="#ffffff" stroke-width="4" paint-order="stroke">3.75</text>
  </g>

  <!-- Ticks -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#5f6368">
    <line x1="656" y1="660" x2="656" y2="668" stroke="#9aa0a6"/>
    <text x="656" y="686" text-anchor="middle">1</text>
    <line x1="812" y1="660" x2="812" y2="668" stroke="#9aa0a6"/>
    <text x="812" y="686" text-anchor="middle">2</text>
    <line x1="968" y1="660" x2="968" y2="668" stroke="#9aa0a6"/>
    <text x="968" y="686" text-anchor="middle">3</text>
    <line x1="1124" y1="660" x2="1124" y2="668" stroke="#9aa0a6"/>
    <text x="1124" y="686" text-anchor="middle">4</text>
    <line x1="1280" y1="660" x2="1280" y2="668" stroke="#9aa0a6"/>
    <text x="1280" y="686" text-anchor="middle">5</text>
    <text x="890" y="710" text-anchor="middle" font-size="13">Mean score (1–5)</text>
  </g>

  <!-- Legend -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#3c4043">
    <rect x="50" y="750" width="18" height="18" rx="3" fill="#8ab4f8"/>
    <text x="78" y="764">Current workflow (items 1–5): group mean 3.20 · Neutral</text>
    <rect x="470" y="750" width="18" height="18" rx="3" fill="#81c995"/>
    <text x="498" y="764">Integrated workspace (items 6–8): group mean 3.70 · Agree</text>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#6b7280">
    <text x="50" y="800">n = 37 for item 1; n = 36 for items 2–8. Neutral 2.60–3.39; Agree 3.40–4.19.</text>
    <text x="50" y="822">Overall weighted mean = 3.39 (Neutral). Percentages and means are rounded to two decimals.</text>
  </g>
</svg>
