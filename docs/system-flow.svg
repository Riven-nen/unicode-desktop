<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="system-flow-title system-flow-desc">
  <title id="system-flow-title">Unicode Lab system flow</title>
  <desc id="system-flow-desc">Student programming environment feeds authorship telemetry into storage and processing, which feeds ICS and Judge0 results into instructor review.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1160" height="820" rx="18" fill="#ffffff" stroke="#dadce0" stroke-width="2"/>

  <!-- Student environment -->
  <rect x="50" y="55" width="1100" height="112" rx="10" fill="#e8f0fe" stroke="#d2e3fc" stroke-width="1.5"/>
  <text x="600" y="105" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#1f2937">Student Programming Environment</text>
  <text x="600" y="137" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#4b5563">Electron + React + Monaco Editor · Python, Java, C/C++</text>

  <line x1="600" y1="171" x2="600" y2="198" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Telemetry -->
  <rect x="50" y="205" width="1100" height="112" rx="10" fill="#e8f0fe" stroke="#d2e3fc" stroke-width="1.5"/>
  <text x="600" y="255" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#1f2937">Authorship Telemetry</text>
  <text x="600" y="287" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#4b5563">Code changes, paste events, typing timing, focus, compilation</text>

  <line x1="600" y1="321" x2="600" y2="348" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Storage -->
  <rect x="50" y="355" width="1100" height="112" rx="10" fill="#e8f0fe" stroke="#d2e3fc" stroke-width="1.5"/>
  <text x="600" y="405" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#1f2937">Data Processing and Storage</text>
  <text x="600" y="437" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#4b5563">Local sync queue · Supabase · PostgreSQL · Row-Level Security</text>

  <line x1="600" y1="471" x2="600" y2="498" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Analysis and execution -->
  <rect x="50" y="505" width="535" height="112" rx="10" fill="#e6f4ea" stroke="#ceead6" stroke-width="1.5"/>
  <text x="317.5" y="555" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#1e4620">ICS</text>
  <text x="317.5" y="587" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#366b3f">Instructor review classification</text>

  <rect x="615" y="505" width="535" height="112" rx="10" fill="#e6f4ea" stroke="#ceead6" stroke-width="1.5"/>
  <text x="882.5" y="555" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#1e4620">Judge0</text>
  <text x="882.5" y="587" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#366b3f">Program execution and test-case results</text>

  <line x1="600" y1="621" x2="600" y2="648" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Review -->
  <rect x="50" y="655" width="1100" height="112" rx="10" fill="#e6f4ea" stroke="#ceead6" stroke-width="1.5"/>
  <text x="600" y="705" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#1e4620">Instructor Review</text>
  <text x="600" y="737" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#366b3f">Submission history, ICS, execution results, grades, and comments</text>

  <!-- Admin note -->
  <line x1="70" y1="790" x2="1130" y2="790" stroke="#e5e7eb" stroke-width="1"/>
  <text x="600" y="817" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" fill="#6b7280">Admin web console (separate app): users, roles, classes, and professor invite codes — same Supabase RLS boundary</text>
</svg>
