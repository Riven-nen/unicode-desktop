<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="data-flow-title data-flow-desc">
  <title id="data-flow-title">Unicode Lab data flow diagram</title>
  <desc id="data-flow-desc">Level 1 data flow diagram showing students, professors, administrators, and Judge0 exchanging data with authoring, synchronization, administration, ICS, review, and execution processes, backed by seven data stores.</desc>

  <defs>
    <marker id="df-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1360" height="960" rx="18" fill="#ffffff" stroke="#dadce0" stroke-width="2"/>

  <!-- External entities -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="50" y="90" width="190" height="90" rx="8" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
    <text x="145" y="130" text-anchor="middle" font-size="20" font-weight="600" fill="#202124">Student</text>
    <text x="145" y="154" text-anchor="middle" font-size="13" fill="#5f6368">desktop workspace</text>

    <rect x="50" y="360" width="190" height="90" rx="8" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
    <text x="145" y="400" text-anchor="middle" font-size="20" font-weight="600" fill="#202124">Admin</text>
    <text x="145" y="424" text-anchor="middle" font-size="13" fill="#5f6368">web console</text>

    <rect x="50" y="630" width="190" height="90" rx="8" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
    <text x="145" y="670" text-anchor="middle" font-size="20" font-weight="600" fill="#202124">Professor</text>
    <text x="145" y="694" text-anchor="middle" font-size="13" fill="#5f6368">desktop dashboard</text>

    <rect x="1170" y="835" width="180" height="80" rx="8" fill="#f8f9fa" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="1260" y="870" text-anchor="middle" font-size="20" font-weight="600" fill="#202124">Judge0</text>
    <text x="1260" y="894" text-anchor="middle" font-size="13" fill="#5f6368">optional external service</text>
  </g>

  <!-- Processes -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="340" y="85" width="280" height="100" rx="12" fill="#e8f0fe" stroke="#d2e3fc" stroke-width="1.5"/>
    <text x="480" y="125" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">1.0 Authoring &amp; Tracking</text>
    <text x="480" y="153" text-anchor="middle" font-size="14" fill="#4b5563">editor · snapshots · paste · typing</text>

    <rect x="340" y="220" width="280" height="100" rx="12" fill="#e8f0fe" stroke="#d2e3fc" stroke-width="1.5"/>
    <text x="480" y="260" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">2.0 Sync, Auth &amp; RLS</text>
    <text x="480" y="288" text-anchor="middle" font-size="14" fill="#4b5563">local queue · Supabase · security</text>

    <rect x="340" y="355" width="280" height="100" rx="12" fill="#e8f0fe" stroke="#d2e3fc" stroke-width="1.5"/>
    <text x="480" y="395" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">3.0 Administration</text>
    <text x="480" y="423" text-anchor="middle" font-size="14" fill="#4b5563">users · roles · classes · invites</text>

    <rect x="340" y="490" width="280" height="100" rx="12" fill="#e8f0fe" stroke="#d2e3fc" stroke-width="1.5"/>
    <text x="480" y="530" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">4.0 ICS &amp; Analytics</text>
    <text x="480" y="558" text-anchor="middle" font-size="14" fill="#4b5563">integrity score · class insights</text>

    <rect x="340" y="625" width="280" height="100" rx="12" fill="#e8f0fe" stroke="#d2e3fc" stroke-width="1.5"/>
    <text x="480" y="665" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">5.0 Review &amp; Grading</text>
    <text x="480" y="693" text-anchor="middle" font-size="14" fill="#4b5563">grades · release · comments</text>

    <rect x="340" y="835" width="280" height="100" rx="12" fill="#e8f0fe" stroke="#d2e3fc" stroke-width="1.5"/>
    <text x="480" y="875" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">6.0 Code Execution</text>
    <text x="480" y="903" text-anchor="middle" font-size="14" fill="#4b5563">local toolchain · Judge0</text>
  </g>

  <!-- Data stores -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="800" y="95" width="280" height="52" rx="4" fill="#e6f4ea" stroke="#a8dab5" stroke-width="1.5"/>
    <text x="816" y="117" font-size="15" font-weight="600" fill="#1e4620">D1 · Workspace Files</text>
    <text x="816" y="135" font-size="12" fill="#366b3f">local disk · course folders</text>

    <rect x="800" y="170" width="280" height="52" rx="4" fill="#e6f4ea" stroke="#a8dab5" stroke-width="1.5"/>
    <text x="816" y="192" font-size="15" font-weight="600" fill="#1e4620">D2 · Profiles &amp; Auth</text>
    <text x="816" y="210" font-size="12" fill="#366b3f">users · roles · sessions</text>

    <rect x="800" y="245" width="280" height="52" rx="4" fill="#e6f4ea" stroke="#a8dab5" stroke-width="1.5"/>
    <text x="816" y="267" font-size="15" font-weight="600" fill="#1e4620">D3 · Classes &amp; Assignments</text>
    <text x="816" y="285" font-size="12" fill="#366b3f">enrollments · test cases · schedules</text>

    <rect x="800" y="320" width="280" height="52" rx="4" fill="#e6f4ea" stroke="#a8dab5" stroke-width="1.5"/>
    <text x="816" y="342" font-size="15" font-weight="600" fill="#1e4620">D4 · Code Telemetry</text>
    <text x="816" y="360" font-size="12" fill="#366b3f">snapshots · pastes · typing · presence</text>

    <rect x="800" y="395" width="280" height="52" rx="4" fill="#e6f4ea" stroke="#a8dab5" stroke-width="1.5"/>
    <text x="816" y="417" font-size="15" font-weight="600" fill="#1e4620">D5 · Submissions &amp; Grades</text>
    <text x="816" y="435" font-size="12" fill="#366b3f">submissions · grades · ICS scores</text>

    <rect x="800" y="470" width="280" height="52" rx="4" fill="#e6f4ea" stroke="#a8dab5" stroke-width="1.5"/>
    <text x="816" y="492" font-size="15" font-weight="600" fill="#1e4620">D6 · Comments &amp; Invites</text>
    <text x="816" y="510" font-size="12" fill="#366b3f">threads · notifications · invite codes</text>

    <rect x="800" y="545" width="280" height="52" rx="4" fill="#e6f4ea" stroke="#a8dab5" stroke-width="1.5"/>
    <text x="816" y="567" font-size="15" font-weight="600" fill="#1e4620">D7 · Execution Runs</text>
    <text x="816" y="585" font-size="12" fill="#366b3f">Judge0 results · compile output</text>
  </g>

  <!-- Data access bus -->
  <line x1="720" y1="160" x2="720" y2="700" stroke="#34a853" stroke-width="3"/>
  <text x="730" y="722" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#188038">Supabase / PostgreSQL / RLS boundary</text>

  <!-- Store connections -->
  <g stroke="#5f6368" stroke-width="1.5" marker-start="url(#df-arrow)" marker-end="url(#df-arrow)">
    <line x1="720" y1="196" x2="800" y2="196"/>
    <line x1="720" y1="271" x2="800" y2="271"/>
    <line x1="720" y1="346" x2="800" y2="346"/>
    <line x1="720" y1="421" x2="800" y2="421"/>
    <line x1="720" y1="496" x2="800" y2="496"/>
    <line x1="720" y1="571" x2="800" y2="571"/>
  </g>

  <!-- Entity and process flows -->
  <g stroke="#5f6368" stroke-width="1.8" marker-start="url(#df-arrow)" marker-end="url(#df-arrow)">
    <line x1="240" y1="135" x2="340" y2="135"/>
    <line x1="240" y1="405" x2="340" y2="405"/>
    <line x1="240" y1="675" x2="340" y2="675"/>
    <line x1="620" y1="885" x2="1170" y2="885"/>
    <line x1="620" y1="135" x2="800" y2="135"/>
  </g>

  <!-- Process to bus -->
  <g stroke="#5f6368" stroke-width="1.8" marker-start="url(#df-arrow)" marker-end="url(#df-arrow)">
    <line x1="620" y1="270" x2="720" y2="270"/>
    <line x1="620" y1="405" x2="720" y2="405"/>
    <line x1="620" y1="540" x2="720" y2="540"/>
    <line x1="620" y1="675" x2="720" y2="675"/>
    <line x1="620" y1="845" x2="720" y2="700"/>
  </g>

  <!-- Authoring to sync -->
  <line x1="480" y1="185" x2="480" y2="220" stroke="#5f6368" stroke-width="1.8" marker-end="url(#df-arrow)"/>

  <!-- Authoring to execution, routed left -->
  <polyline points="340,160 300,160 300,885 340,885" fill="none" stroke="#5f6368" stroke-width="1.8" marker-start="url(#df-arrow)" marker-end="url(#df-arrow)"/>
  <text transform="rotate(-90 300 520)" x="300" y="520" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#5f6368" stroke="#ffffff" stroke-width="4" paint-order="stroke">run request / results</text>

  <!-- Flow labels -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#3c4043" stroke="#ffffff" stroke-width="4" paint-order="stroke">
    <text x="290" y="75" text-anchor="middle">edits, paste, run input ⇄ dashboards</text>
    <text x="290" y="345" text-anchor="middle">roles, classes, invites ⇄ reports</text>
    <text x="290" y="615" text-anchor="middle">grades, comments ⇄ review data</text>
    <text x="710" y="121" text-anchor="middle">workspace files</text>
    <text x="490" y="205">snapshots, paste, typing</text>
    <text x="630" y="262">telemetry</text>
    <text x="630" y="397">admin data</text>
    <text x="630" y="532">ICS data</text>
    <text x="630" y="667">review data</text>
    <text x="660" y="792" text-anchor="middle">run results</text>
    <text x="895" y="872" text-anchor="middle">source + stdin ⇄ stdout + results</text>
  </g>

  <!-- Legend -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#3c4043">
    <rect x="50" y="994" width="34" height="18" rx="3" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.2"/>
    <text x="92" y="1008">External entity</text>

    <rect x="250" y="994" width="34" height="18" rx="5" fill="#e8f0fe" stroke="#d2e3fc" stroke-width="1.2"/>
    <text x="292" y="1008">Process</text>

    <rect x="410" y="994" width="34" height="18" rx="2" fill="#e6f4ea" stroke="#a8dab5" stroke-width="1.2"/>
    <text x="452" y="1008">Data store</text>

    <line x1="570" y1="1003" x2="610" y2="1003" stroke="#5f6368" stroke-width="1.8" marker-start="url(#df-arrow)" marker-end="url(#df-arrow)"/>
    <text x="620" y="1008">Data flow</text>

    <line x1="742" y1="994" x2="742" y2="1012" stroke="#34a853" stroke-width="3"/>
    <text x="754" y="1008">RLS persistence boundary (D2–D7)</text>
  </g>
</svg>
