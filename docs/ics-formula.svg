<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="ics-formula-title ics-formula-desc">
  <title id="ics-formula-title">ICS v3 evidence ledger formula</title>
  <desc id="ics-formula-desc">Diagram of the ICS v3 evidence ledger: authored evidence, negative evidence, confidence, and band rules.</desc>

  <rect x="20" y="20" width="1360" height="950" rx="18" fill="#ffffff" stroke="#dadce0" stroke-width="2"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="50" y="62" font-size="30" font-weight="600" fill="#1f2937">Integrity Compliance Score (ICS) — v3</text>
    <text x="50" y="88" font-size="16" fill="#5f6368">An evidence ledger: the score starts at 50 and moves only when there is evidence.</text>
  </g>

  <!-- Main equation -->
  <rect x="50" y="108" width="1300" height="86" rx="10" fill="#f1f3f4" stroke="#dadce0" stroke-width="1.5"/>
  <text x="700" y="142" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="20" font-weight="600" fill="#202124">ICS = clamp(50 + 45 × (A − E−), 5, 95)</text>
  <text x="700" y="172" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#5f6368">E− = 0.90·P + 0.80·T + 0.20·R + 0.30·W + 0.50·S</text>

  <!-- Authored evidence card -->
  <rect x="50" y="220" width="630" height="300" rx="10" fill="#e6f4ea" stroke="#ceead6" stroke-width="1.5"/>
  <text x="72" y="252" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#1e4620">1. Authored evidence A</text>
  <rect x="560" y="232" width="98" height="26" rx="13" fill="#ceead6"/>
  <text x="609" y="250" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#137333">positive</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12.5" fill="#202124">
    <text x="72" y="290">weighted = 0.5·fixes + 1.5·reworks + 1.5·revisits + undo</text>
    <text x="72" y="310">scored   = clamp(100 × weighted / chars / 2.5, 0, 1)</text>
    <text x="72" y="332">A        = min(scored, cap) × min(1, chars / 200)</text>
    <text x="72" y="354">cap      = 0.50 (&lt;2 structural) · 0.75 (2) · 1.00 (3+)</text>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#3c4043">
    <text x="72" y="386">• typo fix = 1–3 chars; rework = 4–30 chars</text>
    <text x="72" y="408">• revisit = one excursion above the working line</text>
    <text x="72" y="430">• one revisit cannot lift the cap; it is common in honest work</text>
    <text x="72" y="452">• mid-line pauses are recorded but not scored</text>
    <text x="72" y="474">• bulk edits &gt; 30 chars are ignored</text>
    <text x="72" y="496">• measured per 100 inserted chars, not per burst</text>
  </g>

  <!-- Negative evidence card -->
  <rect x="720" y="220" width="630" height="300" rx="10" fill="#fce8e6" stroke="#f2b8b5" stroke-width="1.5"/>
  <text x="742" y="252" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#8c1d18">2. Negative evidence E−</text>
  <rect x="1230" y="232" width="98" height="26" rx="13" fill="#f2b8b5"/>
  <text x="1279" y="250" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#8c1d18">penalty</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12.5" fill="#202124">
    <text x="742" y="290">P = clamp((novel_paste_ratio − allowance)</text>
    <text x="742" y="310">          / (0.60 − allowance), 0, 1)</text>
    <text x="742" y="336">T = (chunk_chars / inserted_chars)</text>
    <text x="742" y="356">  × (0.70 + 0.30·append_only)</text>
    <text x="742" y="382">R = robotic rhythm, W = refocus → line chunk</text>
    <text x="742" y="402">S = similarity (reserved)</text>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#3c4043">
    <text x="742" y="434">• paste allowance: 0 for seatwork, 0.10 for take-home</text>
    <text x="742" y="456">• T only applies above 120 inserted chars</text>
    <text x="742" y="478">• R fires on median &lt; 25 ms or CV &lt; 0.05</text>
    <text x="742" y="500">• R and W can never flag a student alone</text>
    <text x="742" y="518">• typo fixes are weak; one revisit is weak too</text>
  </g>

  <!-- Confidence card -->
  <rect x="50" y="550" width="630" height="210" rx="10" fill="#e8f0fe" stroke="#d2e3fc" stroke-width="1.5"/>
  <text x="72" y="582" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">3. Confidence C</text>
  <rect x="560" y="562" width="98" height="26" rx="13" fill="#d2e3fc"/>
  <text x="609" y="580" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#174ea6">gate</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12.5" fill="#202124">
    <text x="72" y="620">C = 0 when chars &lt; 120, otherwise</text>
    <text x="72" y="640">  min(1, chars / 300) × min(1, edits / 30) × coverage</text>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#3c4043">
    <text x="72" y="672">• coverage = 1.0 for ≥3 snapshots, 0.6 for one, 0.4 for final only</text>
    <text x="72" y="694">• C = 0 below 120 chars; C &lt; 0.30 → review — limited evidence</text>
    <text x="72" y="716">• confidence does not move the score; it decides the band</text>
    <text x="72" y="738">• short sessions cannot be used as proof in either direction</text>
  </g>

  <!-- Bands card -->
  <rect x="720" y="550" width="630" height="210" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
  <text x="742" y="582" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#202124">4. Band rules</text>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#3c4043">
    <text x="742" y="618">• pass: score ≥ 80</text>
    <text x="742" y="640">• review: score ≥ 40, or confidence &lt; 0.30</text>
    <text x="742" y="662">• flag: score &lt; 40, or a corroborated hard rule</text>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="11.5" fill="#3c4043">
    <text x="742" y="692">flag:   P ≥ 0.99 and A ≤ 0.01</text>
    <text x="742" y="710">        T ≥ 0.70 and A ≤ 0.15 and W ≥ 0.50</text>
    <text x="742" y="728">        S ≥ 0.90 and P ≥ 0.50</text>
    <text x="742" y="746">review: P ≥ 0.80 and A ≤ 0.20; T ≥ 0.70 with A ≤ 0.15</text>
  </g>

  <!-- Bottom note -->
  <text x="700" y="810" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#3c4043">Judge0 test results are quality, not integrity; they are reported separately and are not part of the score.</text>
  <text x="700" y="838" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#3c4043">A single signal can hold a submission at review, but a flag needs corroboration. "Flag" means review, not guilty.</text>

  <text x="700" y="930" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#6b7280">Computed by recompute_ics(target_submission) and stored in ics_scores with confidence, evidence, band_reason, and model.</text>
</svg>
