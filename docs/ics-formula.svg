<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="ics-formula-title ics-formula-desc">
  <title id="ics-formula-title">Integrity Compliance Score formula</title>
  <desc id="ics-formula-desc">Diagram of the current ICS formula: paste 35 points, cadence 25, focus 20, and compilation 20, with definitions and score bands.</desc>

  <rect x="20" y="20" width="1360" height="950" rx="18" fill="#ffffff" stroke="#dadce0" stroke-width="2"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="50" y="62" font-size="30" font-weight="600" fill="#1f2937">Integrity Compliance Score (ICS)</text>
    <text x="50" y="88" font-size="16" fill="#5f6368">Server-side score computed from authorship telemetry and Judge0 test results.</text>
  </g>

  <!-- Main equation -->
  <rect x="50" y="108" width="1300" height="76" rx="10" fill="#f1f3f4" stroke="#dadce0" stroke-width="1.5"/>
  <text x="700" y="140" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="18" font-weight="600" fill="#202124">ICS = paste_term + cadence_term + focus_term + compilation_term</text>
  <text x="700" y="166" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" fill="#5f6368">Weights: paste 35 · cadence 25 · focus 20 · compilation 20 · maximum score 100</text>

  <!-- Paste card -->
  <rect x="50" y="205" width="630" height="250" rx="10" fill="#e8f0fe" stroke="#d2e3fc" stroke-width="1.5"/>
  <text x="72" y="235" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">1. Paste</text>
  <rect x="570" y="216" width="88" height="26" rx="13" fill="#d2e3fc"/>
  <text x="614" y="234" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#174ea6">35 points</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="14.5" fill="#202124">
    <text x="72" y="272">P = novel_pasted_chars / max(final_chars, novel_pasted_chars, 1)</text>
    <text x="72" y="296">paste_term = 35 × (1 − P)</text>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#3c4043">
    <text x="72" y="328">• novel_pasted_chars = pasted text not already in an earlier snapshot</text>
    <text x="72" y="350">• final_chars = maximum char_count among the submission's snapshots</text>
    <text x="72" y="372">• internal moves and duplicates are excluded from the paste term</text>
    <text x="72" y="394">• P is clamped to the range 0 to 1; paste_term is capped at 35</text>
  </g>

  <!-- Cadence card -->
  <rect x="720" y="205" width="630" height="250" rx="10" fill="#e8f0fe" stroke="#d2e3fc" stroke-width="1.5"/>
  <text x="742" y="235" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">2. Cadence</text>
  <rect x="1240" y="216" width="88" height="26" rx="13" fill="#d2e3fc"/>
  <text x="1284" y="234" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#174ea6">25 points</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="14.5" fill="#202124">
    <text x="742" y="272">typing_share = intervals ≤ 1500 ms / all intervals</text>
    <text x="742" y="296">C = 50 + (100 × typing_share − 50) × min(1, n / 8)</text>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#3c4043">
    <text x="742" y="328">Fallback when no typing intervals exist:</text>
    <text x="742" y="350" font-family="Cascadia Code, Consolas, monospace" font-size="13.5">C_raw = 100 × min(1, max(0, 1 − sd_gap / mean_gap))</text>
    <text x="742" y="372" font-family="Cascadia Code, Consolas, monospace" font-size="13.5">C = 50 + (C_raw − 50) × min(1, gap_count / 4)</text>
    <text x="742" y="394">• gaps are &gt; 0 and ≤ 1800 s; small samples pull toward 50</text>
    <text x="742" y="416">cadence_term = 25 × (C / 100)</text>
  </g>

  <!-- Focus card -->
  <rect x="50" y="480" width="630" height="250" rx="10" fill="#e6f4ea" stroke="#ceead6" stroke-width="1.5"/>
  <text x="72" y="510" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#1e4620">3. Focus</text>
  <rect x="570" y="491" width="88" height="26" rx="13" fill="#ceead6"/>
  <text x="614" y="509" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#137333">20 points</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="14.5" fill="#202124">
    <text x="72" y="547">F_raw = 100 × min(1, max(0, active_seconds / session_seconds))</text>
    <text x="72" y="571">F = 50 + (F_raw − 50) × min(1, gap_count / 4)</text>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#3c4043">
    <text x="72" y="603">• active_seconds = sum of gaps ≤ 120 s</text>
    <text x="72" y="625">• session_seconds = sum of gaps ≤ 1800 s</text>
    <text x="72" y="647">• gaps longer than 30 minutes are excluded</text>
    <text x="72" y="669">• neutral 50 when no usable session exists</text>
    <text x="72" y="691">focus_term = 20 × (F / 100)</text>
  </g>

  <!-- Compilation card -->
  <rect x="720" y="480" width="630" height="250" rx="10" fill="#e6f4ea" stroke="#ceead6" stroke-width="1.5"/>
  <text x="742" y="510" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#1e4620">4. Compilation</text>
  <rect x="1240" y="491" width="88" height="26" rx="13" fill="#ceead6"/>
  <text x="1284" y="509" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#137333">20 points</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="14.5" fill="#202124">
    <text x="742" y="547">K = 100 × run_passed / run_count</text>
    <text x="742" y="571">compilation_term = 20 × (K / 100)</text>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#3c4043">
    <text x="742" y="603">• newest code_runs result per test case</text>
    <text x="742" y="625">• only rows with test_case_id and passed set</text>
    <text x="742" y="647">• run_count = usable test cases in the submission</text>
    <text x="742" y="669">• neutral 50 when no Judge0 run exists</text>
    <text x="742" y="691">Judge0 is an optional external service</text>
  </g>

  <!-- Bands -->
  <rect x="50" y="755" width="1300" height="130" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
  <text x="72" y="785" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#202124">Final score and review band</text>

  <rect x="72" y="805" width="230" height="46" rx="8" fill="#e6f4ea" stroke="#a8dab5" stroke-width="1.2"/>
  <text x="187" y="824" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#137333">Pass</text>
  <text x="187" y="842" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#1e4620">ICS ≥ 80</text>

  <rect x="322" y="805" width="230" height="46" rx="8" fill="#fef7e0" stroke="#f6d47a" stroke-width="1.2"/>
  <text x="437" y="824" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#8a6d00">Review</text>
  <text x="437" y="842" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#7a5c00">60 ≤ ICS &lt; 80</text>

  <rect x="572" y="805" width="230" height="46" rx="8" fill="#fce8e6" stroke="#f2b8b5" stroke-width="1.2"/>
  <text x="687" y="824" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#b3261e">Flag</text>
  <text x="687" y="842" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#8c1d18">ICS &lt; 60</text>

  <text x="840" y="824" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#3c4043">ICS = paste_term + cadence_term + focus_term + compilation_term</text>
  <text x="840" y="844" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#3c4043">Each term and the final ICS are rounded to 2 decimals.</text>

  <text x="700" y="938" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#6b7280">Computed by recompute_ics(target_submission) and stored in ics_scores. Neutral 50 is used when evidence is insufficient.</text>
</svg>
