<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="survey-group-title survey-group-desc">
  <title id="survey-group-title">Preliminary survey grouped results</title>
  <desc id="survey-group-desc">Group means and response distributions for current workflow, integrated workspace preference, and the overall result.</desc>

  <rect x="20" y="20" width="1360" height="700" rx="18" fill="#ffffff" stroke="#dadce0" stroke-width="2"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="50" y="62" font-size="28" font-weight="600" fill="#1f2937">Preliminary Survey — Grouped Results</text>
    <text x="50" y="88" font-size="15" fill="#5f6368">Current workflow versus preference for an integrated workspace.</text>
  </g>

  <!-- Mean score by group -->
  <text x="50" y="118" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#3c4043">Mean score by group</text>
  <line x1="1030" y1="125" x2="1030" y2="330" stroke="#f29900" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1040" y="118" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#b06000">Agree threshold (3.40)</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="480" y="170" text-anchor="end" font-size="14" fill="#202124">Current workflow</text>
    <rect x="500" y="145" width="499" height="40" rx="4" fill="#8ab4f8"/>
    <text x="1009" y="170" font-size="13" font-weight="600" fill="#174ea6" stroke="#ffffff" stroke-width="4" paint-order="stroke">3.20 · Neutral</text>

    <text x="480" y="230" text-anchor="end" font-size="14" fill="#202124">Integrated workspace</text>
    <rect x="500" y="205" width="577" height="40" rx="4" fill="#81c995"/>
    <text x="1087" y="230" font-size="13" font-weight="600" fill="#137333" stroke="#ffffff" stroke-width="4" paint-order="stroke">3.70 · Agree</text>

    <text x="480" y="290" text-anchor="end" font-size="14" fill="#202124">Overall</text>
    <rect x="500" y="265" width="529" height="40" rx="4" fill="#bdc1c6"/>
    <text x="1039" y="290" font-size="13" font-weight="600" fill="#3c4043" stroke="#ffffff" stroke-width="4" paint-order="stroke">3.39 · Neutral</text>
  </g>

  <line x1="500" y1="330" x2="1280" y2="330" stroke="#9aa0a6" stroke-width="1.5"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#5f6368">
    <line x1="656" y1="330" x2="656" y2="338" stroke="#9aa0a6"/>
    <text x="656" y="356" text-anchor="middle">1</text>
    <line x1="812" y1="330" x2="812" y2="338" stroke="#9aa0a6"/>
    <text x="812" y="356" text-anchor="middle">2</text>
    <line x1="968" y1="330" x2="968" y2="338" stroke="#9aa0a6"/>
    <text x="968" y="356" text-anchor="middle">3</text>
    <line x1="1124" y1="330" x2="1124" y2="338" stroke="#9aa0a6"/>
    <text x="1124" y="356" text-anchor="middle">4</text>
    <line x1="1280" y1="330" x2="1280" y2="338" stroke="#9aa0a6"/>
    <text x="1280" y="356" text-anchor="middle">5</text>
    <text x="890" y="376" text-anchor="middle" font-size="13">Mean score (1–5)</text>
  </g>

  <!-- Response distribution -->
  <text x="50" y="425" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#3c4043">Response distribution by group</text>

  <!-- Current workflow: 17.1% disagree, 49.2% neutral, 33.7% agree -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">
    <text x="480" y="464" text-anchor="end" fill="#202124">Current workflow</text>
    <rect x="500" y="440" width="134" height="40" fill="#ea4335"/>
    <rect x="634" y="440" width="383" height="40" fill="#dadce0"/>
    <rect x="1017" y="440" width="263" height="40" fill="#34a853"/>
    <text x="567" y="465" text-anchor="middle" font-size="11" fill="#ffffff">17.1%</text>
    <text x="825" y="465" text-anchor="middle" font-size="12" fill="#202124">49.2%</text>
    <text x="1148" y="465" text-anchor="middle" font-size="11" fill="#ffffff">33.7%</text>
  </g>

  <!-- Integrated workspace: 3.7% disagree, 44.4% neutral, 51.9% agree -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">
    <text x="480" y="524" text-anchor="end" fill="#202124">Integrated workspace</text>
    <rect x="500" y="500" width="29" height="40" fill="#ea4335"/>
    <rect x="529" y="500" width="347" height="40" fill="#dadce0"/>
    <rect x="876" y="500" width="404" height="40" fill="#34a853"/>
    <text x="702" y="525" text-anchor="middle" font-size="12" fill="#202124">44.4%</text>
    <text x="1078" y="525" text-anchor="middle" font-size="11" fill="#ffffff">51.9%</text>
  </g>

  <!-- Overall: 12.1% disagree, 47.4% neutral, 40.5% agree -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">
    <text x="480" y="584" text-anchor="end" fill="#202124">Overall</text>
    <rect x="500" y="560" width="94" height="40" fill="#ea4335"/>
    <rect x="594" y="560" width="370" height="40" fill="#dadce0"/>
    <rect x="964" y="560" width="316" height="40" fill="#34a853"/>
    <text x="547" y="585" text-anchor="middle" font-size="11" fill="#ffffff">12.1%</text>
    <text x="779" y="585" text-anchor="middle" font-size="12" fill="#202124">47.4%</text>
    <text x="1122" y="585" text-anchor="middle" font-size="11" fill="#ffffff">40.5%</text>
  </g>

  <!-- Legend -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#3c4043">
    <rect x="500" y="625" width="16" height="16" rx="2" fill="#ea4335"/>
    <text x="524" y="638">Disagree (1–2)</text>
    <rect x="655" y="625" width="16" height="16" rx="2" fill="#dadce0"/>
    <text x="679" y="638">Neutral (3)</text>
    <rect x="790" y="625" width="16" height="16" rx="2" fill="#34a853"/>
    <text x="814" y="638">Agree (4–5)</text>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#6b7280">
    <text x="50" y="675">N = 181 current-workflow item responses; N = 108 integrated-workspace item responses; N = 289 overall.</text>
    <text x="50" y="697">Mean interpretation: Neutral 2.60–3.39; Agree 3.40–4.19. Percentages are rounded.</text>
  </g>
</svg>
